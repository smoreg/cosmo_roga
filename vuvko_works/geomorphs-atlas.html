<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--void:#0e1114;--deck:#12161a;--ink:#dfe6e6;--dim:#8e9a9b;--rule:#39434a;--panel:#181d22;
      --attach:#4fa3a0;--skin:#c8503f;--warn:#c9a227}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--void);color:var(--ink);font:400 14px/1.5 "B612",system-ui,sans-serif;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--panel);
     border-bottom:1px solid var(--rule);padding:10px 14px;flex:none}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
select,input{font:400 13px/1 "B612 Mono",monospace;padding:6px 8px;background:var(--deck);
  color:var(--ink);border:1px solid var(--rule);border-radius:0}
.spacer{flex:1}
.count{font:400 12px/1.4 "B612 Mono",monospace;color:var(--dim);align-self:center}
.legend{display:flex;gap:14px;font-size:12px;color:var(--dim);align-items:center}
.swatch{display:inline-block;width:22px;height:4px;vertical-align:middle;margin-right:5px}
main{flex:1;overflow:auto;padding:14px;display:grid;gap:12px;
     grid-template-columns:repeat(auto-fill,minmax(190px,1fr));align-content:start}
figure{margin:0;background:var(--panel);border:1px solid var(--rule);padding:9px;min-width:0}
.frame{position:relative;background:var(--deck);height:140px;display:flex;align-items:center;justify-content:center}
.frame img{max-width:100%;max-height:100%;object-fit:contain}
.frame i{position:absolute;background:var(--attach)}
.frame i.skin{background:var(--skin)}
.frame i.n{top:0;left:0;right:0;height:4px}
.frame i.s{bottom:0;left:0;right:0;height:4px}
.frame i.w{top:0;bottom:0;left:0;width:4px}
.frame i.e{top:0;bottom:0;right:0;width:4px}
figcaption{margin-top:7px;font-size:11.5px;line-height:1.35;min-width:0}
.code{font:700 12px "B612 Mono",monospace}
.klass{float:right;font:400 10.5px "B612 Mono",monospace;letter-spacing:.05em;
  text-transform:uppercase;color:var(--deck);background:var(--dim);padding:1px 5px}
.klass.cap{background:#7fb3d5}.klass.side{background:#9ec27f}.klass.corner{background:#d5b47f}
.klass.core{background:#a9a9b8}.klass.edge{background:#c9a0c9}.klass.loose,.klass.island{background:#6f7a7c}
.klass.spine{background:#c9a227}
.lab{color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{margin-top:4px;display:flex;flex-wrap:wrap;gap:3px}
.tag{font:400 10px "B612 Mono",monospace;border:1px solid var(--rule);padding:0 4px;color:var(--dim)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.prof{font:400 9.5px/1.25 "B612 Mono",monospace;color:var(--dim);margin-top:4px;white-space:pre;overflow:hidden}
.msg{padding:40px;text-align:center;color:var(--dim);grid-column:1/-1}
</style>
</head>
<body>
<div class="bar">
  <div class="field"><label for="q">Search</label><input id="q" type="search" placeholder="fuel, nose, E7…" spellcheck="false"></div>
  <div class="field"><label for="klass">Shape</label><select id="klass"></select></div>
  <div class="field"><label for="kind">Folder</label><select id="kind"></select></div>
  <div class="field"><label for="role">Role</label><select id="role"></select></div>
  <div class="field"><label for="src">Read from</label><select id="src"></select></div>
  <div class="field"><label for="skin">Skin sides</label><select id="skin"></select></div>
  <div class="field"><label for="flag">Flags</label><select id="flag">
    <option value="">any</option><option value="renamed">name disagrees with art</option>
    <option value="needsSkin">wants open space</option><option value="proud">sticks past its box</option>
  </select></div>
  <div class="spacer"></div>
  <div class="legend">
    <span><span class="swatch" style="background:var(--attach)"></span>joins here</span>
    <span><span class="swatch" style="background:var(--skin)"></span>skin — faces space</span>
  </div>
  <div class="count" id="count">…</div>
</div>
<main id="grid"><p class="msg">Loading tiles.taxonomy.json…</p></main>

<script>
/* The atlas exists to be doubted: every card shows the tile, the sides the
   analyser thinks can take a neighbour, and the boundary profiles it read them
   from. If a classification is wrong you can see it here rather than three
   ships later. */
const SIDES = ["n","e","s","w"];
let TILES = [];
const el = id => document.getElementById(id);

fetch("tiles.taxonomy.json").then(r=>{
  if (!r.ok) throw new Error(r.status);
  return r.json();
}).then(data=>{
  TILES = Object.entries(data.tiles).map(([path, t])=>Object.assign({path}, t));
  fillSelects();
  draw();
}).catch(err=>{
  el("grid").innerHTML = '<p class="msg">Could not read <code>tiles.taxonomy.json</code> (' + err.message +
    ').<br>Run <code>python3 geomorph_manifest.py &amp;&amp; python3 geomorph_taxonomy.py</code>, ' +
    'then serve this folder over HTTP.</p>';
});

function fillSelects(){
  const opts = (id, values, label) => {
    const s = el(id);
    s.appendChild(new Option("all " + label, ""));
    for (const [v, n] of values) s.appendChild(new Option(v + " (" + n + ")", v));
  };
  const tally = fn => {
    const c = new Map();
    for (const t of TILES) for (const v of [].concat(fn(t) || [])) c.set(v, (c.get(v)||0)+1);
    return [...c].sort((a,b)=>b[1]-a[1]);
  };
  opts("klass", tally(t=>t.class), "shapes");
  opts("kind",  tally(t=>t.kind),  "folders");
  opts("role",  tally(t=>t.roles), "roles");
  opts("src",   tally(t=>t.source),"sources");
  opts("skin",  tally(t=>t.skin.join("+") || "none"), "sides");
  for (const id of ["q","klass","kind","role","src","skin","flag"])
    el(id).oninput = el(id).onchange = draw;
}

function draw(){
  const q = el("q").value.trim().toLowerCase();
  const f = {klass:el("klass").value, kind:el("kind").value, role:el("role").value,
             src:el("src").value, skin:el("skin").value, flag:el("flag").value};
  const hit = TILES.filter(t=>
    (!f.klass || t.class === f.klass) &&
    (!f.kind  || t.kind === f.kind) &&
    (!f.role  || t.roles.includes(f.role)) &&
    (!f.src   || t.source === f.src) &&
    (!f.skin  || (t.skin.join("+") || "none") === f.skin) &&
    (!f.flag  || (f.flag === "proud" ? t.proud.length : t[f.flag])) &&
    (!q || (t.label + " " + t.path + " " + t.code).toLowerCase().includes(q)));

  el("count").textContent = hit.length + " of " + TILES.length + " tiles";
  const grid = el("grid");
  grid.textContent = "";
  if (!hit.length){ grid.innerHTML = '<p class="msg">Nothing matches.</p>'; return; }
  const frag = document.createDocumentFragment();
  for (const t of hit.slice(0, 400)) frag.appendChild(card(t));
  if (hit.length > 400){
    const p = document.createElement("p");
    p.className = "msg";
    p.textContent = "…and " + (hit.length - 400) + " more. Narrow the filters to see them.";
    frag.appendChild(p);
  }
  grid.appendChild(frag);
}

function card(t){
  const fig = document.createElement("figure");
  const frame = document.createElement("div");
  frame.className = "frame";
  const img = new Image();
  img.loading = "lazy";
  img.src = encodeURI("geomorphs/" + t.path);
  img.alt = t.label;
  frame.appendChild(img);
  for (const s of SIDES){
    const bar = document.createElement("i");
    bar.className = s + (t.skin.includes(s) ? " skin" : "");
    bar.title = s.toUpperCase() + ": " + (t.skin.includes(s) ? "skin — faces space" : "joins a neighbour");
    frame.appendChild(bar);
  }
  const cap = document.createElement("figcaption");
  cap.innerHTML = '<span class="klass ' + t.class + '">' + t.class + '</span>' +
    '<span class="code">' + (t.code || "—") + "</span> " +
    '<span class="lab">' + esc(t.label) + "</span>";
  const tags = document.createElement("div");
  tags.className = "tags";
  const add = (text, warn) => {
    const s = document.createElement("span");
    s.className = "tag" + (warn ? " warn" : "");
    s.textContent = text;
    tags.appendChild(s);
  };
  add(t.ft[0] + "×" + t.ft[1] + " ft");
  add(t.source);
  for (const r of t.roles) add(r);
  if (t.needsSkin) add("wants space", !t.skin.length);
  if (t.renamed) add("named " + t.named[0] + "×" + t.named[1], true);
  if (t.proud.length) add("proud " + t.proud.join(""));
  cap.appendChild(tags);
  const prof = document.createElement("div");
  prof.className = "prof";
  prof.textContent = "N " + t.edge.n + "\nS " + t.edge.s + "\nW " + t.edge.w + "\nE " + t.edge.e;
  cap.appendChild(prof);
  fig.append(frame, cap);
  return fig;
}
function esc(s){ return s.replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
</script>
</body>
</html>
