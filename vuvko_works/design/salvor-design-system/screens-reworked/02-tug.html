<!-- @dsCard group="Screens — reworked" viewport="1366x768" name="02 · The tug" subtitle="As built: orders in the middle, the dock and the rack down the side, no map at all" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>SALVOR — the tug</title>
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script type="module">import * as FX from "../derelict-fx.js";window.FX=FX;</script>
<style>html{overflow:hidden}body{margin:0;background:var(--sv-deep);color:var(--sv-fg);font-family:var(--sv-font-mono);overflow:hidden}#root{width:1366px;height:768px;overflow:hidden}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const {Panel,Tag,Rail,CoreRack,LogStrip}=window.SALVORScreensAsBuilt_2b77ba;

/* ── the tug, as the game actually draws it ───────────────────────────────────
 *
 * Home is a decision and not a place, so the honeycomb does not come back with
 * the drone. What stands where it would have been is the decision — the hull
 * alongside and the orders that can be given about it — and the readout down
 * the side carries what is merely looked at.
 *
 * The rule that arrangement came from: each side has one job, on both halves of
 * the game. The middle is the thing being done (the board aboard a hull, the
 * orders at home); the right is the state (the rack, then the compartment or
 * the dock). Nothing is drawn in both. See INTEGRATION.md.
 */

/* The rack of whichever drone is being looked at. A hull nobody has undocked in
   has spent no integrity, so a preview's bays are all full — which is what
   makes it readable as a preview rather than as the drone that exists. */
const FLYING=[
  {name:"Cutter",value:11,max:11},
  {name:"Thrusters",value:4,max:12,tone:"bad"},
  {name:"Scanner",value:8,max:8},
  {empty:true},
  {name:"Cell",value:8,max:8},
  {name:"Plating",value:9,max:16,tone:"warn"}
];
const PREVIEW={
  spark:[{name:"Cutter",value:11,max:11},{name:"Thrusters",value:12,max:12},{name:"Scanner",value:8,max:8},{name:"Plating",value:16,max:16},{name:"Cell",value:8,max:8},{empty:true},{empty:true}],
  ghost:[{name:"Cutter",value:11,max:11},{name:"Thrusters",value:14,max:14},{name:"Scanner",value:10,max:10},{name:"Plating",value:16,max:16},{name:"Cell",value:8,max:8},{empty:true},{empty:true},{empty:true}]
};

const HULLS=[
  {id:"scrapper",name:"Scrapper",trait:"cheap, and it goes back out",price:0,on:true,core:3,slots:6},
  {id:"spark",name:"Spark",trait:"one more slot, and quicker on its feet",price:90,on:false,core:4,slots:7,speed:120},
  {id:"ghost",name:"Ghost",trait:"quiet, roomy, and it costs the voyage",price:160,on:false,core:5,slots:8,speed:140}
];

/* One line per pressable thing, in the engine's own order, with what it costs
   or why it cannot be spent. A refused line stays on the shelf wearing its
   reason: a shelf that hides what cannot be afforded teaches nothing about the
   price. `into` opens a group; `null` is the line back out of one. */
const ORDERS=[
  {label:"buy a hull",into:"BUY",enabled:true},
  {head:"REPAIR",label:"repair a module",enabled:false,why:"nothing in the rack is damaged"},
  {label:"graft a module",into:"GRAFT",enabled:true,note:"12 cr"},
  {label:"clean a module",enabled:false,why:"nothing in the rack is infected"},
  {head:"RIG",label:"stow a module",into:"STOW",enabled:true},
  {label:"hold & shelf",into:"HOLD",enabled:true},
  {label:"sell for good",into:"SELL",enabled:true,note:"+24 cr"},
  {head:"CHARTERS",label:"take a charter",into:"CHARTER",enabled:true},
  {head:"NEXT HULL",label:"jump → quarantine",enabled:false,why:"not enough credits",note:"30 cr"},
  {label:"cast off — board closes",enabled:true}
];

const LOG=[
  {tag:"tug",text:"Docked at the tug. Four systems standing, one slot empty."},
  {tag:"burn",text:"Your PLATING burns out. Nothing stands between the next hit and your core.",tone:"bad"},
  {tag:"burn",text:"A burned module is gone. Its slot is empty now.",tone:"warn"},
  {tag:"run",text:"Left the OSPREY with 25 CR and the terminal read.",tone:"warn"}
];

const STENCIL={font:"var(--sv-stencil)",letterSpacing:"var(--sv-stencil-track)",textTransform:"uppercase"};

/* Every line of a panel resolves the way the record does — all at once, not
   staggered. The tug is not news arriving, it is a readout already written,
   and a readout that types itself out row by row is one you wait through. */
function useLines(deps){
  const ref=React.useRef(null);
  React.useEffect(()=>{
    if(!window.FX||!ref.current) return;
    return window.FX.reveal(window.FX.linesOf(ref.current),window.FX.PRESETS.all);
  },deps);
  return ref;
}

function Figure({label,value,big}){
  return <div style={{display:"flex",alignItems:"baseline",gap:10}}>
    <span style={{flex:1,...STENCIL,color:"var(--sv-soft)"}}>{label}</span>
    <span style={{font:"var(--sv-display)",fontSize:big?30:20,letterSpacing:"var(--sv-display-track)",color:big?"var(--sv-amber)":"var(--sv-ink)"}}>{value}</span>
  </div>;
}

/* A press points the rack, and a glance leaves it alone. The rack sits directly
   above this list, and pointing it on hover made it flicker through all three
   on the way down to the one being reached for. */
function Drones({hulls,held,onHold}){
  return <div style={{display:"flex",flexDirection:"column",gap:2}}>
    {hulls.map(h=>{
      const open=held===h.id;
      return <div key={h.id} onClick={()=>onHold(open?null:h.id)}
        title={open?"put the rack back":h.on?"the drone on the rails":"show this one in the rack above"}
        onMouseEnter={(e)=>{if(!open)e.currentTarget.style.background="color-mix(in oklab, var(--sv-amber) 7%, transparent)";}}
        onMouseLeave={(e)=>{e.currentTarget.style.background="transparent";}}
        style={{padding:"6px 8px",cursor:"pointer",background:open?"color-mix(in oklab, var(--sv-amber) 12%, transparent)":"transparent",borderLeft:"2px solid "+(h.on?"var(--sv-amber)":open?"var(--sv-rim)":"var(--sv-line)")}}>
        <div style={{display:"flex",alignItems:"baseline",gap:8}}>
          <span style={{font:"var(--sv-title)",letterSpacing:"var(--sv-title-track)",textTransform:"uppercase",color:h.on?"var(--sv-amber)":"var(--sv-ink)"}}>{h.name}</span>
          <span style={{marginLeft:"auto",...STENCIL,color:"var(--sv-soft)"}}>{h.on?"on the rails":h.price+" cr"}</span>
        </div>
        <div style={{font:"var(--sv-body)",color:"var(--sv-soft)"}}>{h.trait}</div>
        {open?<div style={{marginTop:5,display:"flex",gap:6,flexWrap:"wrap"}}>
          <Tag tone="amber">core {h.core}</Tag>
          <Tag tone="neutral">{h.slots} slots</Tag>
          {h.speed?<Tag tone="neutral">speed {h.speed}</Tag>:null}
        </div>:null}
      </div>;
    })}
  </div>;
}

function Orders({lines}){
  const ref=useLines([lines.length]);
  return <div ref={ref} style={{display:"flex",flexDirection:"column",gap:1}}>
    {lines.map((o,i)=><div key={i}>
      {o.head?<div style={{marginTop:9,marginBottom:2,...STENCIL,color:"var(--sv-amber)"}}>{o.head}</div>:null}
      <div title={o.enabled?undefined:o.why}
        onMouseEnter={(e)=>{if(o.enabled||o.into)e.currentTarget.style.background="color-mix(in oklab, var(--sv-amber) 14%, transparent)";}}
        onMouseLeave={(e)=>{e.currentTarget.style.background="transparent";}}
        style={{display:"flex",alignItems:"baseline",gap:10,padding:"6px 9px",cursor:o.enabled||o.into?"pointer":"not-allowed",opacity:o.enabled||o.into?1:.45}}>
        <span style={{width:13,flex:"none",font:"var(--sv-stencil)",color:"var(--sv-amber)"}}>{o.into?"›":"·"}</span>
        <span data-sc style={{font:"var(--sv-body)",color:"var(--sv-ink)"}}>{o.label}</span>
        {o.note?<span data-sc style={{marginLeft:"auto",...STENCIL,color:"var(--sv-soft)"}}>{o.note}</span>:null}
        {!o.enabled&&o.why?<span style={{marginLeft:o.note?8:"auto",...STENCIL,color:"var(--sv-bad)"}}>{o.why}</span>:null}
      </div>
    </div>)}
  </div>;
}

function Screen(){
  const [logOpen,setLogOpen]=React.useState(false);
  const [held,setHeld]=React.useState(null);
  const [sound,setSound]=React.useState(true);
  const mid=useLines([held]);
  const dock=useLines([held]);
  const slots=held&&PREVIEW[held]?PREVIEW[held]:FLYING;

  return <div style={{width:1366,height:768,display:"grid",gridTemplateColumns:"46px minmax(0,1fr) 420px",gridTemplateRows:"minmax(0,1fr) auto",background:"var(--sv-deep)",overflow:"hidden",userSelect:"none",boxSizing:"border-box"}}>

    {/* Three keys, and one of them is not a menu at all. Sound is what a player
        reaches for mid-turn, and a menu to open, a page to find and a row to
        press is three presses for a one-press thing. */}
    <Rail style={{gridColumn:1,gridRow:1,zIndex:90}} items={[
      {id:"sys",glyph:"≡",title:"menu"},
      {id:"help",glyph:"?",title:"controls"},
      {id:"sound",glyph:sound?"◀":"◁",title:sound?"sound on":"sound off"}
    ]} onSelect={(id)=>{if(id==="sound")setSound(v=>!v);}}/>

    <div ref={mid} style={{gridColumn:2,gridRow:1,minWidth:0,minHeight:0,overflowY:"auto",display:"flex",flexDirection:"column",gap:14,padding:18,background:"radial-gradient(ellipse 80% 70% at 36% 28%, var(--sv-deck) 0%, var(--sv-deep) 76%)"}}>

      {/* The account is the tug's, so it sits under the tug's own name. What it
          is tied to is the other half — and no alarm on either: the tug is the
          half of the game with no alarm and no corridors, and a gauge under the
          tug's name reads as the tug's however it is labelled. */}
      <Panel variant="readout" title="Salt Drifter" stencil="tug" mount="none">
        <div style={{display:"flex",gap:18,alignItems:"stretch"}}>
          <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:3}}>
            <Figure label="banked" value="49" big/>
            <Figure label="carried" value="0"/>
            <Figure label="keycards" value="0"/>
            <Figure label="in the hold" value="1"/>
            <Figure label="sortie" value="2"/>
          </div>
          <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:7,paddingLeft:18,borderLeft:"1px solid var(--sv-line)"}}>
            <div style={{...STENCIL,color:"var(--sv-soft)"}}>alongside</div>
            <div style={{font:"var(--sv-display)",fontSize:24,letterSpacing:"var(--sv-display-track)",color:"var(--sv-ink)"}}>the KESTREL</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <Tag tone="warn">1/3 up</Tag>
              <Tag tone="amber">150 cr</Tag>
            </div>
          </div>
        </div>
      </Panel>

      <Panel variant="readout" title="Orders" stencil="dock" mount="none" fill>
        <Orders lines={ORDERS}/>
      </Panel>
    </div>

    <div style={{gridColumn:3,gridRow:1,minHeight:0,overflowY:"auto",backgroundImage:"var(--sv-scan)",backgroundColor:"var(--sv-void)",borderLeft:"1px solid var(--sv-line)",padding:"10px 16px 0",display:"flex",flexDirection:"column",gap:8}}>
      {/* Picking a drone below points this at that hull rather than unfolding a
          summary under itself: two racks compared where the rack already is. */}
      <Panel variant="readout" title="Rack" stencil={held?"preview":"drone"} mount="none">
        <CoreRack core={held?(held==="ghost"?5:4):1} coreMax={held?(held==="ghost"?5:4):3} slots={slots}/>
      </Panel>

      <div ref={dock}>
        <Panel variant="readout" title="Dock" stencil="drones" mount="none">
          <Drones hulls={HULLS} held={held} onHold={setHeld}/>
        </Panel>
      </div>
    </div>

    <LogStrip entries={LOG} expanded={logOpen} onToggle={()=>setLogOpen(!logOpen)}
      style={{gridColumn:"1 / -1",gridRow:2,zIndex:100}}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Screen/>);
</script>
</body></html>
