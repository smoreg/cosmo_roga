<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Map — SALVOR hulls</title>
<style>
:root{
  --void:#0e1a2e; --deck:#0a0e16; --panel:#0c1526; --ink:#d7e3f6; --dim:#8296b4;
  --rule:#2b3f5e; --drone:#5fb8d9; --ship:#cf6a5a; --node:#5fbf9b; --door:#e8c15a;
  --mono: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--void); color:var(--ink); font:13px/1.5 var(--mono);
  display:grid; grid-template-columns:1fr 340px; height:100vh; overflow:hidden;
}
#stage{position:relative; overflow:hidden; background:var(--deck)}
svg{width:100%; height:100%; display:block}
#side{
  border-left:1px solid var(--rule); background:var(--panel);
  overflow:auto; padding:14px; display:flex; flex-direction:column; gap:14px;
}
h1{font-size:15px; letter-spacing:.14em; text-transform:uppercase; margin:0}
h2{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
   margin:0 0 6px; font-weight:400}
.row{display:flex; gap:8px; align-items:center}
.row label{flex:0 0 92px; color:var(--dim)}
input,select,button{
  font:inherit; color:var(--ink); background:var(--void);
  border:1px solid var(--rule); padding:5px 8px; border-radius:0;
}
input{flex:1; min-width:0}
button{cursor:pointer}
button:hover{border-color:var(--ink)}
button.go{border-color:var(--drone); color:var(--drone); width:100%; padding:9px}
button.go:hover{background:color-mix(in oklab, var(--drone) 20%, transparent)}
#report{white-space:pre-wrap; font-size:12px; line-height:1.6}
.ok{color:var(--node)} .bad{color:var(--ship)} .warn{color:var(--door)}
#facts{display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:12px}
#facts b{font-weight:400; color:var(--dim)}
#json{
  width:100%; height:150px; resize:vertical; font:11px/1.4 var(--mono);
  background:var(--void); color:var(--dim); border:1px solid var(--rule); padding:6px;
}
.hint{color:var(--dim); font-size:11px; line-height:1.55}
.legend{display:flex; flex-wrap:wrap; gap:4px 10px; font-size:11px; color:var(--dim)}
.legend i{display:inline-block; width:9px; height:9px; margin-right:4px; font-style:normal}
</style>
</head>
<body>

<div id="stage"><svg id="map" role="img" aria-label="Generated room map"></svg></div>

<div id="side">
  <h1>Room map</h1>
  <p class="hint">
    A compartment graph on SALVOR's honeycomb: one room per hull section, one
    lattice cell per room, doors on shared edges. Exports a <code>ShipData</code>
    that <code>Ship.rehydrate</code> takes as it is. Run
    <code>layoutShip</code> on it once for the terminal schematic.
  </p>

  <div>
    <h2>Hull</h2>
    <div class="row"><label for="seed">seed</label><input id="seed" value="OSPREY-1"></div>
    <div class="row"><label for="prof">beam</label><input id="prof" value="8-6-3"></div>
    <div class="row"><label for="dock">dock at</label>
      <select id="dock" style="flex:1">
        <option value="mid">amidships — both ends lie deep</option>
        <option value="bow">the bow — walk aft to the reactor</option>
        <option value="stern">the stern — walk forward to the bridge</option>
      </select>
    </div>
    <div class="row"><label for="loops">loop doors</label><input id="loops" type="range" min="0" max="100" value="0"></div>
    <div class="row"><label for="art">deck art</label>
      <select id="art" style="flex:1">
        <option value="on">tiles under the hexes</option>
        <option value="off">bare compartments</option>
      </select>
    </div>
    <p class="hint" id="artnote"></p>
  </div>

  <button class="go" id="go">Generate</button>

  <div>
    <h2>The ship</h2>
    <div id="facts"></div>
  </div>

  <div>
    <h2>Validation</h2>
    <div id="report"></div>
    <p class="hint" id="loopnote"></p>
  </div>

  <div>
    <h2>Kinds</h2>
    <div class="legend" id="legend"></div>
  </div>

  <div>
    <h2>Export</h2>
    <textarea id="json" readonly spellcheck="false"></textarea>
    <div class="row" style="margin-top:6px">
      <button id="save" style="flex:1">Download ShipData</button>
      <button id="copy" style="flex:1">Copy</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ===========================================================================
   A room map for SALVOR.

   The other half keeps a ship as a graph of compartments — `rooms[]`,
   `doors[]`, `entry` — and draws it on a pointy-top hex lattice with exactly
   one cell per room. This page produces that directly.

   It does not rasterise a deck plan and it does not hunt connected regions of
   floor. Those passes exist to tell a tactical floor which pixels are walkable,
   and there is no tactical floor here: movement is room to room through doors.
   A hull section *is* a compartment and its position *is* its kind.

   Nothing is fetched, so it runs from `file://` and needs none of the artwork.
   =========================================================================== */

/* ------------------------------------------------------------------ lattice */

/* SALVOR's six directions, in its order (`rooms/gen/hexlayout.ts`). Note that
   none of them is vertical: corridors run level or diagonal and never up. */
const HEX_DIRS = [
  {q: 1, r: 0},   // east
  {q: 1, r:-1},   // north-east
  {q: 0, r: 1},   // south-east
  {q: 0, r:-1},   // north-west
  {q:-1, r: 1},   // south-west
  {q:-1, r: 0},   // west
];

/* The corridor gap. One would pack the hexagons edge to edge and leave a
   corridor nowhere to be; SALVOR's renderer scales by this and the difference
   is the corridor. */
const HEX_SPACING = 1.34;

const keyOf = (c) => c.q + "," + c.r;
function adjacent(a, b){
  return HEX_DIRS.some(d => a.q + d.q === b.q && a.r + d.r === b.r);
}

/* ------------------------------------------------------------------- random */

/* Counter-based, so a seed reproduces a ship exactly. */
function rng(seed){
  let h = 2166136261 >>> 0;
  for (const ch of String(seed)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return function next(){
    h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0;
    return h / 4294967296;
  };
}
const pick = (rand, list) => list[Math.floor(rand() * list.length) % list.length];

/* --------------------------------------------------------------- the hull */

/**
 * A hull profile, read from the keel outward.
 *
 * The old encoding was a list of column widths, which quietly assumed a
 * rectangular grid: on a honeycomb a "column" is not a straight line, every
 * other row sits half a cell across, and a hull built that way cannot be
 * symmetric about anything. This one is written in the lattice's own terms.
 *
 * Each digit is the number of compartments in one row *along the ship*,
 * starting at the keel. "9-8-6-3" is a keel nine sections long, the rows
 * either side of it eight, then six, then three — a hull nine by seven with
 * the beam tapering away from the spine.
 *
 * Only half is given, because the other half is the same half. That is what
 * makes the silhouette symmetric by construction rather than by arithmetic.
 */
function parseProfile(text){
  const parts = String(text || "").split(/[^0-9]+/).filter(Boolean)
    .map(Number).filter(n => n >= 1 && n <= 16);
  return parts.length ? parts.slice(0, 8) : [6];
}

/**
 * The hull as lattice cells, already symmetric and already turned.
 *
 * Rows run along the ship and stack across the beam, so `q` is length and `r`
 * is beam: low `q` is aft and high `q` is the bow. That is the ninety-degree
 * turn the whole plan needs, taken here once and for all.
 *
 * The mirror is exact, and it is exact because of one identity. A cell's place
 * along the ship is `q + r/2`, so a row at `-r` matching a row at `+r` needs
 * `q' = q + r` — an integer, always. No rounding, no parity rule, and no
 * column squared off to make the arithmetic come out: row minus two is row
 * plus two, cell for cell.
 */
function hullCells(profile){
  const cells = [];
  profile.forEach(function alongTheShip(len, k){
    /* Centre the row on the ship's middle. Rounding here only ever shifts a
       row half a cell, which is the offset the lattice is built out of. */
    const start = -Math.round((len - 1) / 2 + k / 2);
    for (let i = 0; i < len; i++) cells.push({q: start + i, r: k});
    /* And its reflection, which is the same row seen from the other side. */
    if (k > 0) for (let i = 0; i < len; i++) cells.push({q: start + i + k, r: -k});
  });
  const xs = cells.map(c => c.q + c.r / 2);
  return {
    cells,
    beam: profile.length * 2 - 1,
    length: Math.round(Math.max(...xs) - Math.min(...xs)) + 1,
  };
}

/* --------------------------------------------------------------- the kinds */

/* `games/salvor/src/content/zones.ts`, as the generator needs to know it: what
   must appear exactly once, what must sit deep, and what may fill the rest. */
const ENTRY_KIND = "docking";
const DEEP_DEPTH = 3;
/* `pull` says which end of the ship the compartment belongs at: -1 aft, +1
   forward. Columns run west to east, so aft is a low column and the bow high. */
const REQUIRED = [
  {kind: "engineering", name: "ENGINEERING", deep: false, pull: -1},
  {kind: "reactor",     name: "REACTOR",     deep: true,  pull: -1},
  {kind: "control",     name: "CONTROL",     deep: true,  pull:  1},
];
const FILLER = [
  {kind: "corridor",    name: "CORRIDOR RING", weight: 3, cover: false},
  {kind: "cargo",       name: "CARGO BAY",     weight: 2, cover: true},
  {kind: "storage",     name: "STORAGE",       weight: 2, cover: true},
  {kind: "maintenance", name: "MAINTENANCE",   weight: 2, cover: true},
  {kind: "hab",         name: "HAB BLOCK",     weight: 2, cover: false},
  {kind: "workshop",    name: "WORKSHOP",      weight: 1, cover: true},
  {kind: "armory",      name: "ARMORY",        weight: 1, cover: true},
  {kind: "med",         name: "MED BAY",       weight: 1, cover: false},
  {kind: "lab",         name: "LAB",           weight: 1, cover: false},
  {kind: "mess",        name: "MESS",          weight: 1, cover: false},
  {kind: "sensors",     name: "SENSOR BAY",    weight: 1, cover: false},
  {kind: "cryo",        name: "CRYO",          weight: 1, cover: false},
  {kind: "lifesupport", name: "LIFE SUPPORT",  weight: 1, cover: false},
  {kind: "hydroponics", name: "HYDROPONICS",   weight: 1, cover: true},
  {kind: "escapepods",  name: "ESCAPE PODS",   weight: 1, cover: false},
];
const COLOUR = {
  docking:"#5fb8d9", reactor:"#cf6a5a", control:"#e8c15a", engineering:"#5fbf9b",
  corridor:"#3b4c66", cargo:"#4a5f7e", storage:"#44566f", maintenance:"#465a74",
  hab:"#53698a", workshop:"#4f6480", armory:"#7a5560", med:"#4d7a74",
  lab:"#4b6f8a", mess:"#556a85", sensors:"#5a7fa0", cryo:"#5c7f9e",
  lifesupport:"#4e7a68", hydroponics:"#4f7a5c", escapepods:"#6b6f8a",
};
const weighted = FILLER.flatMap(k => Array.from({length: k.weight}, () => k));

/* --------------------------------------------------------------- deck art */

/**
 * A hundred-foot tile to put under each compartment.
 *
 * The direction matters. `hexmap.html` reads a room's kind *off* the tile that
 * happens to be under it; here the room is decided first and the tile is
 * chosen to match, by the same taxonomy roles. Same tags, opposite direction —
 * which is what lets the ship be a ship before there is any artwork at all,
 * and lets the artwork be missing without the ship changing.
 *
 * Fetched, so this is the one part of the page that needs a server. Without
 * one it is simply absent and the compartments are drawn bare.
 */
let TILES = null;

/**
 * The six ways out of a compartment, and what each asks of the artwork.
 *
 * A hexagon has six neighbours and a square tile has four edges, which sounds
 * like a mismatch and is not. Laid brick fashion a cell meets its east and
 * west neighbours along a whole edge, and its four diagonal neighbours along
 * half an edge each: two share its northern edge and two its southern. So a
 * north edge carries up to two doorways and they are not interchangeable — the
 * one to the north-east is the eastern of the two.
 *
 * Which is exactly why the archive puts its doors a quarter and three quarters
 * along an edge. `side` is the ship-space edge the neighbour is reached
 * through and `half` says which end of it.
 */
const SHIP_STEP = {
  e:  {step: [1, 0],  side: "e", half: null},
  w:  {step: [-1, 0], side: "w", half: null},
  ne: {step: [1, -1], side: "n", half: "far"},
  nw: {step: [0, -1], side: "n", half: "near"},
  se: {step: [0, 1],  side: "s", half: "far"},
  sw: {step: [-1, 1], side: "s", half: "near"},
};

const KIND_ROLES = {
  docking:["airlock","bay"], engineering:["drive","service"], reactor:["drive","fuel"],
  control:["command"],       cargo:["bay"],                   storage:["bay","service"],
  maintenance:["service"],   hab:["quarters"],                mess:["quarters"],
  med:["quarters","service"],cryo:["quarters"],               lab:["command","service"],
  sensors:["command"],       armory:["weapon"],               workshop:["weapon","service"],
  corridor:["vertical","service"], hydroponics:["green"],     lifesupport:["service"],
  escapepods:["bay","airlock"],
};

async function loadTiles(){
  const note = document.getElementById("artnote");
  try {
    const [man, tax] = await Promise.all([
      fetch("geomorphs/geomorphs.manifest.json").then(r => r.json()),
      fetch("tiles.taxonomy.json").then(r => r.json()),
    ]);
    /**
     * How much bigger the file is than the deck inside it.
     *
     * The archive draws a hundred-foot tile as 1440 pixels square, and a
     * hundred feet at sixty pixels to a five-foot square is 1200 — the other
     * 240 are bleed, two squares of it on every side, which the manifest
     * records. Drawn whole into its own cell a tile therefore sits inside a
     * ten per cent margin, and every tile on the deck is ringed by a gap it
     * did not ask for. That is the gap; it was never the geometry.
     *
     * So each tile is drawn at the size that puts its *deck* on the cell and
     * lets the bleed hang over its neighbours, which is what bleed is for.
     */
    const feetPerPx = man.feetPerSquare / man.pxPerSquare;
    const drawable = new Map();
    for (const tile of man.tiles){
      if (tile.overlay) continue;
      const deckPx = tile.w / feetPerPx;
      drawable.set(tile.path, deckPx > 0 ? tile.px[0] / deckPx : 1);
    }
    const byRole = new Map();
    const skin = new Map();
    const doors = new Map();
    const proud = new Map();
    const all = [];
    const corner = new Map();
    const bleed = new Map();
    for (const path in tax.tiles){
      const tile = tax.tiles[path];
      const ft = tile.ft || [];
      /* One compartment is one section is one hundred feet square. Anything
         else would have to be cut or stretched to sit under a hexagon. */
      if (!drawable.has(path)) continue;
      bleed.set(path, drawable.get(path));
      /* Fifty-foot pieces are kept aside for the chamfers, and only the ones
         that are edge art: a corner of open deck laid into a hull step reads
         as a hole rather than as plating. */
      if (ft[0] === 50 && ft[1] === 50){
        /* Corner plating, and the taxonomy is asked rather than guessed at.
           Three tests, each of which was learnt from a picture:

           `class` is the archive's own word for the shape — 211 of the
           fifty-foot pieces are corners and the rest are caps, edges, cores
           and loose fittings, which is why filling a notch with "anything
           with two plated sides" put masts and shuttles beside the ship.

           `source` says where the plating was read from. "art" means the hull
           curve is actually drawn on those sides; "folder" means it was
           guessed from the folder name because the art showed none, and the
           taxonomy's own note says that guess stamped 135 of 143 fully walled
           rooms as hull corners. Those are the open rooms that were turning up
           at the edge of the ship with their walls missing.

           And a drive is not plating. An engine block has its own place at the
           stern; it is not what a step in the hull is made of. */
        const sk = tile.skin || [];
        if (sk.length !== 2) continue;
        if (tile.class !== "corner" || tile.source !== "art") continue;
        if ((tile.proud || []).length) continue;
        if ((tile.roles || []).some(r => r === "drive" || r === "fuel")) continue;
        if (!sk.every(k => (tile.sides || {})[k] === "shaped")) continue;
        bleed.set(path, drawable.get(path));
        /* The archive draws a corner in whichever hand it was drawn in, so the
           four orientations are reached by flipping rather than by hoping one
           of each exists. Registered under every pair it can be turned into. */
        for (const flip of FLIPS){
          /* Indexed by the ship directions the plating actually ends up
             facing, which is what the notch asks for. */
          const pair = sk.map(k => facesAfter(k, flip)).sort().join("");
          if (!corner.has(pair)) corner.set(pair, []);
          corner.get(pair).push({path, flip});
        }
        continue;
      }
      if (ft[0] !== 100 || ft[1] !== 100) continue;
      /* Same caution on the big tiles: plating guessed from a folder name is
         not plating, so a tile is only allowed to claim a side faces space
         when the hull curve is drawn on it. */
      if (tile.source === "folder") continue;
      all.push(path);
      skin.set(path, tile.skin || []);
      doors.set(path, tile.doors || {});
      proud.set(path, tile.proud || []);
      for (const role of tile.roles || []){
        if (!byRole.has(role)) byRole.set(role, []);
        byRole.get(role).push(path);
      }
    }
    TILES = all.length ? {byRole, skin, doors, proud, all, corner, bleed} : null;
    note.textContent = TILES
      ? all.length + " hundred-foot tiles, "
        + [...corner.values()].reduce((n, l) => n + l.length, 0) + " fifty-foot corners."
      : "No hundred-foot tiles in the index.";
  } catch {
    TILES = null;
    note.textContent = "No deck art: the tiles are fetched, so this page wants "
      + "a server (python3 -m http.server from vuvko_works/). Compartments are drawn bare.";
  }
}

/**
 * Ship directions to tile edges, under the rotation.
 *
 * The archive draws its ships upright — engines at the bottom, bridge at the
 * top — and this hull is turned ninety degrees clockwise, so every tile has to
 * turn with it. A tile's north edge ends up facing the ship's bow, which is
 * east. Get this wrong and the art is merely sideways; get it silently wrong
 * and every wall and doorway is matched against the wrong edge as well.
 */
const TILE_SIDE = {e: "n", s: "e", w: "s", n: "w"};

/** The same map read the other way: which way a tile's own edge ends up facing. */
const TILE_SHIP = {n: "e", e: "s", s: "w", w: "n"};

/**
 * The four hands a corner can be drawn in.
 *
 * The archive draws each corner once, in whichever hand it was drawn in, so
 * three of the four orientations simply do not exist as files. They exist as
 * reflections, which is how the archive itself ships its `[Mirror]` variants —
 * so the missing ones are made rather than waited for.
 */
const FLIPS = [
  {sx: 1,  sy: 1},
  {sx: -1, sy: 1},
  {sx: 1,  sy: -1},
  {sx: -1, sy: -1},
];

/**
 * Where a tile's own edge ends up pointing once the tile is drawn.
 *
 * Order matters and it is not the order it reads in. SVG applies
 * `rotate(90) scale(sx sy)` to points right to left — the tile is mirrored
 * first, in its own frame, and the result is then turned — so an edge is
 * flipped as a *tile* edge and only then becomes a ship direction. Doing it
 * the other way round, flipping after the turn, is a different transform for
 * every one of the four corners, because a quarter turn and a mirror do not
 * commute. That is what had the plating curving into the ship.
 */
function facesAfter(tileSide, flip){
  let side = tileSide;
  if (flip.sx < 0) side = side === "e" ? "w" : side === "w" ? "e" : side;
  if (flip.sy < 0) side = side === "n" ? "s" : side === "s" ? "n" : side;
  return TILE_SHIP[side];
}

/**
 * Where a doorway has to sit for two tiles to meet at it.
 *
 * The archive puts them a quarter and three quarters along an edge, and
 * 1625 of the 1768 openings on a hundred-foot tile are at one of those two
 * places. Those are the ones that line up: neighbour to neighbour on a whole
 * section, and across a half-section step as well, where the one at 25 meets
 * the one at 75. A door anywhere else opens onto its neighbour's wall.
 */
const DOOR_STATIONS = [25, 75];
const DOOR_SLOP = 2;

/** How many of an edge's openings sit at a station a neighbour can meet. */
function standardDoors(positions){
  const seen = new Set();
  for (const x of positions || []){
    for (const st of DOOR_STATIONS){
      if (Math.abs(x - st) <= DOOR_SLOP) seen.add(st);
    }
  }
  return seen.size;
}

/**
 * Which tile a compartment wears.
 *
 * Role decides what kind of deck it is; `skin` decides whether it can sit
 * there at all. A tile's skin sides are its hull plating, so a section at the
 * edge of the ship wants plating exactly where there is no neighbour, and a
 * section in the middle wants none at all — otherwise the plan grows a hull
 * wall through the middle of itself and stops reading as one ship.
 *
 * Seeded, so a seed reproduces the picture.
 */
function artFor(rooms, seed, sections, occupied, ship){
  if (!TILES) return null;
  const rand = rng(seed + ":art");

  /* Which sections a door actually joins, so a tile can be asked for an
     opening exactly where the ship has one. A wall in the archive is a white
     line and a door is a black break in it, which is how the taxonomy knows
     where the openings are; every hundred-foot tile that has them puts them
     near 25 and 75 feet along the edge, so two neighbours that both carry one
     meet — on a whole section, and across a half-section step alike, where 25
     lands on 75. */
  const joined = new Set();
  for (const door of ship.doors){
    if (door.a === door.b || door.state === "airlock") continue;
    joined.add(door.a + ">" + door.b);
    joined.add(door.b + ">" + door.a);
  }
  const roomAt = new Map();
  for (const [id, cell] of sections) roomAt.set(keyOf(cell), id);

  const out = new Map();
  for (const room of rooms){
    const roles = KIND_ROLES[room.kind] || [];
    let pool = [];
    for (const role of roles){
      const found = TILES.byRole.get(role);
      if (found) pool = pool.concat(found);
    }
    if (!pool.length) pool = TILES.all;

    /* What each of the four walls has to be, folded down from six neighbours.
       `doors` counts the openings that edge owes — up to two on the north and
       south, which is why the archive's quarter-and-three-quarters stations
       exist; `space` is true only when the whole edge faces out. */
    const here = sections.get(room.id);
    const want = {n: {doors: 0, walls: 0, open: 0, faces: 0},
                  s: {doors: 0, walls: 0, open: 0, faces: 0},
                  e: {doors: 0, walls: 0, open: 0, faces: 0},
                  w: {doors: 0, walls: 0, open: 0, faces: 0}};
    for (const dir in SHIP_STEP){
      const {step, side} = SHIP_STEP[dir];
      const wall = want[side];
      wall.faces++;
      const key = keyOf({q: here.q + step[0], r: here.r + step[1]});
      if (!occupied.has(key)) { wall.open++; continue; }
      if (joined.has(room.id + ">" + roomAt.get(key))) wall.doors++;
      else wall.walls++;
    }

    let best = null, bestScore = -Infinity;
    /* A bounded look: the pools run to a couple of hundred and every one is a
       fair candidate, so this walks the whole pool from a seeded offset rather
       than sampling it. */
    const start = Math.floor(rand() * pool.length);
    for (let n = 0; n < pool.length; n++){
      const path = pool[(start + n) % pool.length];
      const skin = new Set(TILES.skin.get(path) || []);
      const doors = TILES.doors.get(path) || {};
      const proud = new Set(TILES.proud.get(path) || []);
      let score = 0;
      for (const dir of ["n", "s", "e", "w"]){
        const side = TILE_SIDE[dir];
        const need = want[dir];
        const plated = skin.has(side);
        const stations = standardDoors(doors[side]);
        /* Art that runs off the edge of its own tile has to have somewhere to
           run to. A proud side laid against a neighbour paints over it, so the
           spill is what says this tile faces out. */
        if (proud.has(side)) score += need.open === need.faces ? 4 : -8;

        if (need.open === need.faces){
          /* The whole edge faces space: plating is what belongs there, and a
             doorway opening onto vacuum is the one thing that cannot be. */
          score += plated ? 3 : -1;
          score += stations > 0 ? -3 : 1;
        } else {
          /* Plating inside the ship is a hull wall through the middle of the
             deck, whatever else the tile gets right. */
          score += plated ? -4 : 1;
          /* And the openings: one for each neighbour this edge owes a door to,
             at the stations that meet a neighbour's own. Short is the fault
             that matters — a door that opens onto a wall is a room that cannot
             be entered; spare openings are only untidy. */
          score += stations >= need.doors ? 4 * need.doors : -6 * (need.doors - stations);
          score += Math.max(0, stations - need.doors) * -1;
        }
      }
      if (score > bestScore) { bestScore = score; best = path; }
      if (score >= 16) break;            // nothing can beat a wall-perfect fit
    }
    out.set(room.id, best);
  }
  return out;
}

/* ------------------------------------------------------------------- build */

function buildShip(opts){
  const rand = rng(opts.seed);
  const profile = parseProfile(opts.profile);
  const {cells, beam, length} = hullCells(profile);
  if (cells.length < 8) return {error: "Too few sections. Give the profile more rows, or wider ones."};

  /* Where the drone comes aboard. At the bow the run walks aft into the
     engines, which is the reading the hull's own art gives; at the stern it
     walks forward to the bridge. Both are legal and the deep rooms follow. */
  /* Where the drone comes aboard.
     Amidships by default, and not for realism: the reactor and the bridge are
     both marked deep, and they sit at opposite ends of a ship. Board at either
     end and the far one is deep while the near one is two doors in. Board in
     the middle and the ship runs away from you in both directions, which is
     the only place all three systems can lie past the deep line at once. */
  const atBow = opts.dock === "bow";
  const along = (c) => c.q + c.r / 2;
  const ends = cells.map(along);
  const aft = Math.min(...ends), fore = Math.max(...ends);
  const wantX = opts.dock === "mid" ? (aft + fore) / 2 : atBow ? fore : aft;
  const reach = Math.min(...cells.map(c => Math.abs(along(c) - wantX)));
  const onEntryEdge = cells.filter(c => Math.abs(along(c) - wantX) === reach);
  const entryCell = onEntryEdge[Math.floor(rand() * onEntryEdge.length) % onEntryEdge.length];

  /* Rooms, in a fixed order so ids are dense and a seed is reproducible. */
  const order = cells.slice().sort((a, b) => along(a) - along(b) || a.r - b.r);
  const rooms = order.map(function asRoom(cell, id){
    return {
      id, label: "r" + id, kind: "", name: "", depth: 0,
      /* Filled in below. `col`/`row` are the terminal schematic's grid, not
         the section grid and not the honeycomb — a column per depth, boxes
         stacked down it. The real pass is `gen/layout.ts`'s `layoutShip`,
         which the importing game runs; this is a sane starting point. */
      col: 0, row: 0, cover: false, hazard: "",
      explored: false, scanned: false, marks: [],
      data: {hex: {q: cell.q, r: cell.r}},
      _cell: cell,
    };
  });
  const byKey = new Map(rooms.map(r => [keyOf(r.data.hex), r]));
  const entry = byKey.get(keyOf(entryCell));

  /* Doors on shared edges. Every orthogonally neighbouring pair of sections is
     a candidate; the lattice embedding guarantees the two cells touch, so each
     one can be drawn as a corridor rather than a labelled chip. */
  /* Every shared edge is a candidate, and the lattice has six of them — the
     two whole ones east and west, and the four halves on the diagonals. */
  const candidates = [];
  for (const room of rooms){
    for (const dir of ["e", "se", "sw"]){          // half the six; the rest are these seen from the other end
      const {step} = SHIP_STEP[dir];
      const other = byKey.get(keyOf({q: room._cell.q + step[0], r: room._cell.r + step[1]}));
      if (other) candidates.push({a: room.id, b: other.id});
    }
  }

  /* A spanning tree first, so the ship is one ship. What is left over is a
     loop, and only a loop may be shut for good: sealing a tree edge would
     strand everything behind it, which is the guarantee `validateShip` checks
     as "unreachable even with a cutter".

     The tree is grown with a cap of two children a compartment. That is not
     tidiness — the schematic draws a column per depth, so every door to a
     deeper room leaves by the same wall, and a room with three of them is a
     box with three wires out of one side, which `layoutFaults` refuses. A
     compartment nothing will adopt at the cap is adopted anyway on a second
     pass: a ship in two pieces is a worse fault than a crowded wall. */
  const KIDS = 2;
  /* The schematic draws a column per depth and holds six boxes in one, so a
     depth band wider than that cannot be drawn at all (`MAX_COLUMN`). */
  const BAND = 6;
  const seen = new Set([entry.id]);
  const kids = new Map([[entry.id, 0]]);
  /* How deep each compartment came out, and how many share that depth. The
     schematic draws a column per depth and holds six boxes in one, so a band
     that would overflow pushes its next compartment further in instead —
     which is a longer walk, not a broken picture. */
  const deep = new Map([[entry.id, 0]]);
  const parent = new Map();
  const wide = new Map([[0, 1]]);
  const tree = [];
  const loops = [];
  let pending = candidates.slice();

  function grow(cap, band){
    const queue = [...seen];
    while (queue.length){
      const here = queue.shift();
      for (let i = pending.length - 1; i >= 0; i--){
        const edge = pending[i];
        const far = edge.a === here ? edge.b : edge.b === here ? edge.a : null;
        if (far === null || seen.has(far)) continue;
        /* The entry never relaxes. It carries the airlock on its shallow wall
           and everything else leaves by the deep one, so a third child there
           is a third door out of one side of the box whatever the rest of the
           ship needs. */
        const limit = here === entry.id ? KIDS : cap;
        if ((kids.get(here) ?? 0) >= limit) continue;
        const depth = deep.get(here) + 1;
        /* Left for a deeper compartment to adopt, which is what keeps the band
           inside what the schematic can draw. On the last pass anything still
           unclaimed is taken anyway: a ship in two pieces is the worse fault. */
        if (band && (wide.get(depth) ?? 0) >= BAND) continue;
        pending.splice(i, 1);
        kids.set(here, (kids.get(here) ?? 0) + 1);
        kids.set(far, 0);
        deep.set(far, depth);
        parent.set(far, here);
        wide.set(depth, (wide.get(depth) ?? 0) + 1);
        seen.add(far); tree.push(edge); queue.push(far);
      }
    }
  }
  /* Relaxed a step at a time rather than all at once: the first compartment
     that cannot be adopted at two should not hand every other one a licence. */
  for (const cap of [KIDS, KIDS, 3, 4, Infinity]){
    if (seen.size === rooms.length) break;
    /* Two passes at two children: the first keeps the bands narrow, the second
       takes whatever that left behind. */
    grow(cap, cap === KIDS && !grow.relaxed);
    if (cap === KIDS) grow.relaxed = true;
  }
  grow.relaxed = false;
  if (seen.size !== rooms.length){
    return {error: "The profile makes a hull in more than one piece. Check the digits."};
  }

  /* Whatever the tree did not take is a loop, and a loop is optional. */
  for (const edge of pending) loops.push(edge);

  /* The entry carries the airlock as well, so it gives up its loops: a grid
     cell has four orthogonal neighbours, which is the whole budget, and the
     entry would otherwise come out at five and be refused. */
  for (let i = loops.length - 1; i >= 0; i--){
    if (loops[i].a === entry.id || loops[i].b === entry.id) loops.splice(i, 1);
  }

  /* Depth is doors from the entry, over the tree alone — which is what the
     schematic's columns are, and the loops cannot shorten it because a loop is
     only ever added between rooms the tree already placed. */
  const doors = [];
  const addDoor = (a, b, state) => {
    doors.push({id: doors.length, label: "d" + doors.length, a, b, state});
  };
  for (const edge of tree) addDoor(edge.a, edge.b, rand() < 0.45 ? "closed" : "open");

  const near = new Map([[entry.id, 0]]);
  const walk = [entry.id];
  while (walk.length){
    const here = walk.shift();
    for (const door of doors){
      const far = door.a === here ? door.b : door.b === here ? door.a : null;
      if (far === null || near.has(far)) continue;
      near.set(far, near.get(here) + 1);
      walk.push(far);
    }
  }
  for (const room of rooms) room.depth = near.get(room.id) ?? 0;

  /* A depth band the schematic cannot draw is a ship that cannot be shown,
     whatever the honeycomb makes of it. Caught here, where the profile can be
     blamed, rather than by the importing game. */
  const band = new Map();
  for (const room of rooms) band.set(room.depth, (band.get(room.depth) ?? 0) + 1);
  for (const [depth, n] of band){
    if (n > BAND){
      return {error: "Depth " + depth + " holds " + n + " compartments and the "
        + "schematic draws " + BAND + " to a column. Narrow the beam, or board "
        + "at an end so the ship runs away from you one way instead of two."};
    }
  }

  const deeperOut = new Map(rooms.map(r => [r.id, 0]));
  for (const door of doors){
    if (door.a === door.b) continue;
    const da = near.get(door.a), db = near.get(door.b);
    if (db > da) deeperOut.set(door.a, deeperOut.get(door.a) + 1);
    else if (da > db) deeperOut.set(door.b, deeperOut.get(door.b) + 1);
  }
  for (const [id, n] of deeperOut){
    if (n > 2){
      return {error: "A compartment has " + n + " ways deeper into the ship and "
        + "the schematic draws two to a wall. Try another seed, or a profile "
        + "that does not fan out so fast."};
    }
  }

  const stacked = new Map();
  for (const room of rooms){
    const n = stacked.get(room.depth) ?? 0;
    stacked.set(room.depth, n + 1);
    room.col = room.depth;
    room.row = n;
  }

  /* Now the loops — and only between compartments the tree left at the same
     depth.

     The schematic gives a box one wall per direction and allows two doors out
     of a wall only if they leave it opposite ways. A room's shallower wall
     already carries the door it was reached by, so a second one there is a
     coin toss against that rule; and a third door to deeper rooms is refused
     outright. A loop between equals lands on the top or the bottom instead,
     where nothing is competing for the space. One per compartment, so two can
     never land on the same one. */
  const looped = new Set();
  const loopShare = Number(opts.loops) / 100;
  for (const edge of loops){
    if (rand() > loopShare) continue;
    /* Between equals, and between siblings.

       The schematic puts a column per depth and joins two boxes in one column
       with a straight wire, so it will only draw the link if they end up in
       neighbouring rows. Nothing here chooses those rows — `layoutShip` does,
       on the other side — but it stacks a compartment's children together, so
       two rooms that were reached through the same door are the pair most
       likely to come out adjacent. Anything else is a wire across the column,
       which that layout counts as a fault. */
    if (near.get(edge.a) !== near.get(edge.b)) continue;
    if (parent.get(edge.a) !== parent.get(edge.b)) continue;
    if (looped.has(edge.a) || looped.has(edge.b)) continue;
    looped.add(edge.a); looped.add(edge.b);
    addDoor(edge.a, edge.b, rand() < 0.5 ? "sealed" : "closed");
  }

  /* The three systems a derelict is neutralised by need three compartments to
     stand in, each exactly once, and two of them below the deep line. Placed
     before the filler so the filler can never crowd them out.

     Placed by *where they belong* first and by depth second. A reactor amidships
     and a bridge in the engine room satisfy every rule the validator has and
     still look like nobody drew the ship — the drives are aft because that is
     where the thrust goes, and the bridge is forward because that is where the
     windows are. Each spec names the end it wants; among the compartments at
     that end, the deepest wins. */
  const taken = new Set([entry.id]);
  const missing = [];
  for (const spec of REQUIRED){
    const wanted = rooms.filter(r => !taken.has(r.id) && (!spec.deep || r.depth >= DEEP_DEPTH));
    if (!wanted.length){ missing.push(spec.kind); continue; }
    /* `pull` is -1 for the stern and +1 for the bow; ties break on depth. */
    wanted.sort(function byEnd(a, b){
      const ea = spec.pull * along(a._cell), eb = spec.pull * along(b._cell);
      return eb - ea || b.depth - a.depth;
    });
    const fits = wanted[0];
    taken.add(fits.id);
    fits.kind = spec.kind; fits.name = spec.name;
  }

  entry.kind = ENTRY_KIND; entry.name = "DOCKING BAY";
  for (const room of rooms){
    if (room.kind) continue;
    const spec = pick(rand, weighted);
    room.kind = spec.kind; room.name = spec.name; room.cover = spec.cover;
    if (rand() < 0.10) room.hazard = "vented";
  }

  /* The airlock is a self-edge on the entry: one door, both ends the same room,
     which is the shape `validateShip` insists on. */
  doors.push({id: doors.length, label: "a1", a: entry.id, b: entry.id, state: "airlock"});

  /* Where each compartment sits on the section grid. Kept beside the ship
     rather than on it: `ShipData` is exactly what the other half serialises,
     and a field it does not know is a field that comes back on a save. */
  const sections = new Map(rooms.map(r => [r.id, {q: r._cell.q, r: r._cell.r}]));
  const occupied = new Set(cells.map(keyOf));
  for (const room of rooms) delete room._cell;
  return {
    ship: {rooms, doors, entry: entry.id},
    missing, sections, occupied,
    stats: {beam, length, loops: loops.length, sections: cells.length,
            boards: opts.dock === "mid" ? "amidships" : atBow ? "the bow" : "the stern"},
  };
}

/* --------------------------------------------------------------- validation */

/* The same questions `packages/engine/src/rooms/gen/validate.ts` asks, so the
   page can say whether what it just made is usable before anyone downloads it. */
function validate(ship, missing){
  const out = [];
  const say = (ok, text) => out.push({ok, text});

  say(ship.rooms.every((r, i) => r.id === i), "room ids are dense");
  say(ship.doors.every((d, i) => d.id === i), "door ids are dense");

  const airlocks = ship.doors.filter(d => d.state === "airlock");
  say(airlocks.length === 1, airlocks.length + " airlock, expected exactly one");
  say(airlocks.length === 1 && airlocks[0].a === ship.entry && airlocks[0].b === ship.entry,
      "the airlock hangs off the entry at both ends");

  const entry = ship.rooms[ship.entry];
  say(entry.depth === 0, "entry is at depth 0");
  say(entry.kind === ENTRY_KIND, "entry is a " + ENTRY_KIND);

  /* With a cutter every door but the airlock opens, so nothing may be an island. */
  const seen = new Set([ship.entry]);
  const queue = [ship.entry];
  while (queue.length){
    const here = queue.shift();
    for (const door of ship.doors){
      if (door.state === "airlock") continue;
      const far = door.a === here ? door.b : door.b === here ? door.a : null;
      if (far === null || seen.has(far)) continue;
      seen.add(far); queue.push(far);
    }
  }
  say(seen.size === ship.rooms.length,
      seen.size === ship.rooms.length
        ? "every room is reachable with a cutter"
        : (ship.rooms.length - seen.size) + " rooms unreachable even with a cutter");

  for (const spec of REQUIRED){
    const found = ship.rooms.filter(r => r.kind === spec.kind);
    say(found.length === 1, spec.kind + " appears " + found.length + " time(s), expected once");
    if (spec.deep && found.length === 1){
      say(found[0].depth >= DEEP_DEPTH,
          spec.kind + " sits at depth " + found[0].depth + ", deep line is " + DEEP_DEPTH);
    }
  }
  if (missing.length) say(false, "no compartment was deep enough for: " + missing.join(", "));

  /* Every room's cell must actually touch its neighbours', or the picture says
     a door in chips where there should be a corridor. */
  const cellOf = new Map(ship.rooms.map(r => [r.id, r.data.hex]));
  const chips = ship.doors.filter(d =>
    d.state !== "airlock" && !adjacent(cellOf.get(d.a), cellOf.get(d.b))).length;
  say(chips === 0, chips === 0
    ? "every door is a corridor; none demoted to a chip"
    : chips + " doors cannot be drawn as corridors");

  return out;
}

/* ------------------------------------------------------------------ drawing */

const seedOf = () => document.getElementById("seed").value;

const SVG = "http://www.w3.org/2000/svg";
function el(name, attrs){
  const node = document.createElementNS(SVG, name);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  return node;
}
function centreOf(cell, size){
  const s = size * HEX_SPACING;
  return {x: s * Math.sqrt(3) * (cell.q + cell.r / 2), y: s * 1.5 * cell.r};
}
function corners(c, size){
  const out = [];
  for (let i = 0; i < 6; i++){
    const a = Math.PI / 180 * (60 * i - 30);
    out.push((c.x + size * Math.cos(a)).toFixed(2) + "," + (c.y + size * Math.sin(a)).toFixed(2));
  }
  return out.join(" ");
}

function draw(ship, art, sections){
  const svg = document.getElementById("map");
  svg.replaceChildren();
  const size = 30;

  /* The lattice is the geometry, and the tiles sit on it.

     A honeycomb puts alternate rows half a column across, and half a column is
     fifty feet — which is exactly the offset a hundred-foot tile is allowed to
     take. So the plan is laid brick fashion on the lattice's own coordinates
     and comes out continuous: neighbours meet along a full edge east and west,
     and along a half edge on each of the four diagonals. Nothing had to become
     a square grid for the deck to join up.

     Each tile is turned ninety degrees clockwise with the rest of the ship:
     the archive draws upright, engines at the bottom and bridge at the top,
     and this hull is on its side. */
  /* Axial to picture. A cell's place along the ship is `q + r/2` — the same
     identity the mirror is built on — and rows are a pitch apart, so tiles of
     one pitch square meet brick fashion with no gap anywhere. */
  const pitch = size * 2;
  const at = (id) => {
    const cell = sections.get(id);
    return {x: (cell.q + cell.r / 2) * pitch, y: cell.r * pitch};
  };
  const seats = ship.rooms.map(r => at(r.id));
  /* Inset inside its own cell, which is what leaves the gap a corridor runs
     through — the same reason SALVOR spaces its hexagons by a third. */
  const hex = pitch * 0.5;

  if (art){
    const plan = el("g", {opacity: .78});

    /* Fifty-foot corners where the hull steps.

       A notch is a cell the hull does not use but nearly surrounds: empty,
       and with three or more of its six neighbours occupied. Filling it
       carries the plating across the step instead of leaving a stair. Most of
       the archive's fifty-foot pieces are masts and scoops and shuttles, which
       read as debris beside a ship; the ones used here have plating on two
       adjoining sides and nothing spilling off them. */
    if (TILES && TILES.corner.size){
      const trimRand = rng(seedOf() + ":trim");
      const filled = new Set([...sections.values()].map(keyOf));
      const notches = new Map();
      for (const cell of sections.values()){
        for (const dir in SHIP_STEP){
          const {step} = SHIP_STEP[dir];
          const near = {q: cell.q + step[0], r: cell.r + step[1]};
          const key = keyOf(near);
          if (filled.has(key)) continue;
          notches.set(key, near);
        }
      }
      for (const [, near] of notches){
        let held = 0;
        const openSides = {n: 0, s: 0, e: 0, w: 0};
        for (const dir in SHIP_STEP){
          const {step, side} = SHIP_STEP[dir];
          if (filled.has(keyOf({q: near.q + step[0], r: near.r + step[1]}))) held++;
          else openSides[side]++;
        }
        if (held < 3) continue;                    // a lone cell in space, not a step
        const facing = ["n", "s", "e", "w"].filter(d => openSides[d] > 0);
        if (facing.length !== 2) continue;         // not a corner
        /* Ship directions, matching how the pool is indexed. It used to look
           up a tile-space key against a ship-space index, which found a tile
           for the wrong corner whenever the two happened to collide. */
        const key = facing.slice().sort().join("");
        const pool = TILES.corner.get(key);
        if (!pool || !pool.length) continue;
        const cx = (near.q + near.r / 2) * pitch, cy = near.r * pitch;
        const chosen = pick(trimRand, pool);
        const span = pitch * (TILES.bleed.get(chosen.path) ?? 1);
        const plate = el("g", {
          transform: "translate(" + cx + " " + cy + ") rotate(90) scale("
            + chosen.flip.sx + " " + chosen.flip.sy + ")",
          opacity: .85,
        });
        plate.appendChild(el("image", {
          href: "geomorphs/" + chosen.path,
          x: -span / 2, y: -span / 2, width: span, height: span,
          preserveAspectRatio: "none",
        }));
        plan.appendChild(plate);
      }
    }
    ship.rooms.forEach(function plate(room, i){
      const tile = art.get(room.id);
      if (!tile) return;
      const c = seats[i];
      /* Sized so the deck inside the file lands on the cell; the bleed goes
         over the neighbours, where it belongs. */
      const span = pitch * (TILES.bleed.get(tile) ?? 1);
      plan.appendChild(el("image", {
        href: "geomorphs/" + tile,
        x: c.x - span / 2, y: c.y - span / 2, width: span, height: span,
        preserveAspectRatio: "none",
        transform: "rotate(90 " + c.x + " " + c.y + ")",
      }));
    });
    svg.appendChild(plan);
  }
  /* Corridors under the compartments, so a hexagon always covers its own end. */
  const links = el("g", {"stroke-linecap":"round", fill:"none"});
  for (const door of ship.doors){
    if (door.state === "airlock") continue;
    const a = seats[door.a], b = seats[door.b];
    const shut = door.state === "sealed";
    links.appendChild(el("line", {
      x1:a.x, y1:a.y, x2:b.x, y2:b.y,
      stroke: shut ? "var(--ship)" : "var(--door)",
      "stroke-width": shut ? 3 : 5,
      "stroke-dasharray": door.state === "closed" ? "6 5" : "",
      opacity: shut ? .9 : .75,
    }));
  }
  svg.appendChild(links);

  const cells = el("g", {});
  ship.rooms.forEach(function drawRoom(room, i){
    const c = seats[i];
    const fill = COLOUR[room.kind] || "#3b4c66";
    const g = el("g", {});
    const tile = art ? art.get(room.id) : null;
    g.appendChild(el("polygon", {
      points: corners(c, hex),
      fill, "fill-opacity": tile ? (room.id === ship.entry ? .34 : .22) : (room.id === ship.entry ? .95 : .72),
      stroke: room.id === ship.entry ? "#ffffff" : (tile ? fill : "var(--rule)"),
      "stroke-width": room.id === ship.entry ? 2.5 : (tile ? 2.5 : 1.5),
      "stroke-opacity": tile ? .9 : 1,
    }));
    const label = el("text", {
      x: c.x, y: c.y - 2, "text-anchor":"middle",
      fill: tile ? "#ffffff" : "#08101c", stroke: tile ? "#05080d" : "none",
      "stroke-width": tile ? 2.5 : 0, "paint-order":"stroke",
      "font-size": 9, "font-weight": 700, "font-family":"var(--mono)",
    });
    label.textContent = room.name.split(" ")[0].slice(0, 8);
    g.appendChild(label);
    const sub = el("text", {
      x: c.x, y: c.y + 10, "text-anchor":"middle",
      fill: tile ? "#cfe0f2" : "#08101c", stroke: tile ? "#05080d" : "none",
      "stroke-width": tile ? 2.2 : 0, "paint-order":"stroke",
      "font-size": 8, opacity:.85, "font-family":"var(--mono)",
    });
    sub.textContent = room.label + " d" + room.depth;
    g.appendChild(sub);
    cells.appendChild(g);
  });
  svg.appendChild(cells);

  /* Which way the ship faces, said out loud on the picture. */
  const box = seats.reduce((b, s) => ({
    minX: Math.min(b.minX, s.x), maxX: Math.max(b.maxX, s.x),
    minY: Math.min(b.minY, s.y), maxY: Math.max(b.maxY, s.y),
  }), {minX:1e9, maxX:-1e9, minY:1e9, maxY:-1e9});
  const mid = (box.minY + box.maxY) / 2;
  for (const end of [{x: box.minX - size * 2.4, t:"ENGINES"}, {x: box.maxX + size * 2.4, t:"BOW"}]){
    const tag = el("text", {
      x: end.x, y: mid, "text-anchor":"middle", fill:"var(--dim)",
      "font-size": 11, "letter-spacing": 2, "font-family":"var(--mono)",
    });
    tag.textContent = end.t;
    svg.appendChild(tag);
  }

  const pad = size * 4.5;
  svg.setAttribute("viewBox", [
    (box.minX - pad).toFixed(1), (box.minY - pad).toFixed(1),
    (box.maxX - box.minX + pad * 2).toFixed(1), (box.maxY - box.minY + pad * 2).toFixed(1),
  ].join(" "));
}

/* --------------------------------------------------------------------- page */

let CURRENT = null;

function generate(){
  const built = buildShip({
    seed: document.getElementById("seed").value,
    profile: document.getElementById("prof").value,
    dock: document.getElementById("dock").value,
    loops: document.getElementById("loops").value,
  });
  const report = document.getElementById("report");
  if (built.error){
    report.innerHTML = '<span class="bad">' + built.error + "</span>";
    return;
  }
  CURRENT = built.ship;
  const wanted = document.getElementById("art").value === "on";
  const art = wanted
    ? artFor(built.ship.rooms, document.getElementById("seed").value,
             built.sections, built.occupied, built.ship)
    : null;
  draw(built.ship, art, built.sections);

  const checks = validate(built.ship, built.missing);
  report.innerHTML = checks.map(c =>
    '<span class="' + (c.ok ? "ok" : "bad") + '">' + (c.ok ? "OK  " : "BAD ") + c.text + "</span>"
  ).join("\n");

  /* Loops are the one thing this side cannot promise. A second way between two
     compartments is a wire drawn inside one column of the schematic, and that
     column's rows are assigned by the importing game's own layout pass — so
     whether the wire is drawable is decided after this page has finished. A
     tree always draws. */
  const rings = built.ship.doors.filter(d => d.state === "sealed" || d.state === "closed").length;
  document.getElementById("loopnote").textContent = Number(document.getElementById("loops").value) > 0
    ? "Loop doors are on. A loop joins two compartments at the same depth, which "
      + "the schematic draws as a wire inside one column — and it will only draw "
      + "it if that game's layout pass happens to put them in neighbouring rows. "
      + "This side cannot know. A hull with no loops always draws."
    : "";
  void rings;

  const kinds = new Set(built.ship.rooms.map(r => r.kind));
  document.getElementById("facts").innerHTML = [
    ["rooms", built.ship.rooms.length],
    ["doors", built.ship.doors.length],
    ["beam", built.stats.beam + " sections"],
    ["length", built.stats.length + " sections"],
    ["loops", built.stats.loops + " possible"],
    ["deepest", Math.max(...built.ship.rooms.map(r => r.depth)) + " doors in"],
    ["boards at", built.stats.boards],
  ].map(([k, v]) => "<b>" + k + "</b><span>" + v + "</span>").join("");

  document.getElementById("legend").innerHTML = [...kinds].sort().map(k =>
    '<span><i style="background:' + (COLOUR[k] || "#3b4c66") + '"></i>' + k + "</span>"
  ).join("");

  /* The export is the ship and nothing else: `ShipData` is exactly what
     `JSON.stringify(ship)` produces on the other side. */
  document.getElementById("json").value = JSON.stringify(built.ship, null, 1);
}

document.getElementById("go").onclick = generate;
document.getElementById("save").onclick = function save(){
  if (!CURRENT) return;
  const name = "ship-" + String(document.getElementById("seed").value).replace(/\W+/g, "_") + ".json";
  const a = document.createElement("a");
  a.download = name;
  a.href = URL.createObjectURL(new Blob([JSON.stringify(CURRENT, null, 1)], {type:"application/json"}));
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
};
document.getElementById("copy").onclick = function copy(){
  const box = document.getElementById("json");
  box.select();
  navigator.clipboard?.writeText(box.value);
};
for (const id of ["seed", "prof", "dock", "loops", "art"]){
  document.getElementById(id).addEventListener("change", generate);
}
loadTiles().then(generate);
</script>
