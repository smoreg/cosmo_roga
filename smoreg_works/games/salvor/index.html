<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SALVOR</title>
  <!-- Relative, like every other asset: itch.io serves the build from a subdirectory. -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <style>
    /* Dark scrollbars: the panel and the log scroll themselves. */
    html { color-scheme: dark; }
    html, body { margin: 0; padding: 0; background: #0a0d10; color: #b9c4cc; }
    /* The screen is a full-viewport grid and lays itself out, so the page does
       not centre it: centring a thing that already fills the window only gives
       it somewhere to be pushed to. */
    body { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; }
    #game { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
